name: Pele renderer trial checks
on:
  push:
    branches: [feat/pele-renderer-trial-20261028]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Pandoc (required by existing guide build)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc
      - run: npm test
