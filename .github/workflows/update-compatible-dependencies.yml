name: Update compatible dependencies

on:
  schedule:
    - cron: "23 19 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Update compatible versions
        run: npm update

      - name: Validate update
        run: npm test

      - name: Commit tested lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependencies are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update compatible dependencies"
          git pull --rebase origin main
          git push origin HEAD:main
